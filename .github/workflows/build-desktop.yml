name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "site/**"
      - "README.md"

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist:win

      - name: Write checksum
        shell: pwsh
        run: |
          $file = Get-Item release\*.exe
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii release\SHA256SUMS-windows-x64.txt

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: samDub-0.5.0-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS-windows-x64.txt
          if-no-files-found: error
          retention-days: 30

  macos-intel:
    name: macOS Intel
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Intel packages
        run: npm run dist:mac:intel

      - name: Write checksums
        run: |
          cd release
          shasum -a 256 samDub-0.5.0-macos-intel.dmg samDub-0.5.0-macos-intel.zip > SHA256SUMS-macos-intel.txt

      - name: Upload Intel Mac packages
        uses: actions/upload-artifact@v4
        with:
          name: samDub-0.5.0-macos-intel
          path: |
            release/*.dmg
            release/*-macos-intel.zip
            release/SHA256SUMS-macos-intel.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish v0.5.0 release
    if: github.ref == 'refs/heads/master'
    needs:
      - windows-x64
      - macos-intel
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v5
        with:
          pattern: samDub-0.5.0-*
          path: release
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.5.0 release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.5.0 release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "samDub 0.5.0" \
              --notes "Windows x64 and Intel macOS packages. This release is unsigned, so Windows SmartScreen or macOS Gatekeeper may ask for confirmation. SHA-256 files are included."
          fi
