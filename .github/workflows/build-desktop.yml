name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "site/**"
      - "README.md"

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist:win

      - name: Write checksum
        shell: pwsh
        run: |
          $file = Get-Item release\*.exe
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii release\SHA256SUMS-windows-x64.txt

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: samDub-0.5.0-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS-windows-x64.txt
          if-no-files-found: error
          retention-days: 30

  macos-intel:
    name: macOS Intel
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Intel packages
        run: npm run dist:mac:intel

      - name: Write checksums
        run: |
          cd release
          shasum -a 256 samDub-0.5.0-macos-intel.dmg samDub-0.5.0-macos-intel.zip > SHA256SUMS-macos-intel.txt

      - name: Upload Intel Mac packages
        uses: actions/upload-artifact@v4
        with:
          name: samDub-0.5.0-macos-intel
          path: |
            release/*.dmg
            release/*-macos-intel.zip
            release/SHA256SUMS-macos-intel.txt
          if-no-files-found: error
          retention-days: 30
